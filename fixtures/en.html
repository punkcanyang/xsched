<!DOCTYPE html>

<head>

<title>xsched fixture — en (Scheduled)</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; background:#000; color:#e7e9ea; margin:0; padding:16px; }

  [role="dialog"] { border:1px solid #2f3336; border-radius:16px; max-width:520px; padding:12px 14px; }

    <div role="tab" aria-selected="true">Scheduled</div>

  <div id="sched-list">
