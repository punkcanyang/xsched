<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Synthetic native picker</title><style>
body{background:#0f1419;color:#e7e9ea;font:16px system-ui;padding:20px} [role=dialog]{max-width:520px;padding:20px;border:1px solid #536471;border-radius:16px}label{display:inline-block;margin:8px}select{padding:8px}button{margin:8px;padding:10px} .banner{color:#ffd400}
</style></head><body><p class="banner">Synthetic schedule picker: unverified selectors; all dates are fake, 2027+.</p><form id="composer"><button type="submit" id="post">Post</button></form><div role="dialog" aria-modal="true"><h2>Schedule (synthetic)</h2><form id="schedule-form"><div data-testid="scheduledDateField"></div><div data-testid="scheduledTimeField"></div><button type="button" id="confirm">Confirm</button><button type="submit" id="schedule">Schedule</button></form></div><script>
window.fixtureSend={confirm:0,schedule:0,post:0,submit:0,input:0,change:0};
for(const id of ['confirm','schedule','post'])document.getElementById(id).addEventListener('click',()=>window.fixtureSend[id]++);
for(const form of document.querySelectorAll('form'))form.addEventListener('submit',event=>{event.preventDefault();window.fixtureSend.submit++;});
for(const control of document.querySelectorAll('select'))for(const type of ['input','change'])control.addEventListener(type,()=>window.fixtureSend[type]++);
</script></body></html>
