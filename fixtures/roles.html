<!-- 依公開來源重建，非真頁快照｜local fixture, not a real x.com page. All data is fake. -->
<!-- 選擇器改版情境：沒有 data-testid="cellInnerDiv"，只剩 role + aria-label（日文 a11y 線索）。 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xsched fixture — roles only (no data-testid)</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; background:#000; color:#e7e9ea; margin:0; padding:16px; }
  .banner { color:#ffd400; font-size:12px; margin:0 0 12px; }
  [role="dialog"] { border:1px solid #2f3336; border-radius:16px; max-width:520px; padding:12px 14px; }
  [role="tablist"] { display:flex; gap:16px; border-bottom:1px solid #2f3336; margin-bottom:6px; }
  [role="tab"] { padding:8px 2px; color:#8b98a5; }
  [role="tab"][aria-selected="true"] { color:#e7e9ea; box-shadow: inset 0 -2px 0 #1d9bf0; }
  [role="listitem"] { display:block; padding:10px 2px; border-top:1px solid #2f3336; }
  .when { color:#71767b; font-size:13px; }
  .body { margin-top:2px; }
</style>
</head>
<body>
<p class="banner">本機 fixture，依公開來源重建，非真頁快照（資料全為假）</p>
<div role="dialog" aria-label="Unsent posts">
  <div role="tablist">
    <div role="tab" aria-selected="false">Drafts</div>
    <div role="tab" aria-selected="true">Scheduled</div>
  </div>
  <div id="sched-list">
    <div role="listitem" aria-label="Will send on Fri, Oct 16, 2026 at 7:30 AM Local fixture roles-only row A">
      <div role="button">
        <div class="when">Will send on Fri, Oct 16, 2026 at 7:30 AM</div>
        <div class="body">Local fixture roles-only row A</div>
      </div>
    </div>
    <div role="listitem" aria-label="Will send on Sat, Oct 17, 2026 at 6:00 PM Local fixture roles-only row B">
      <div role="button">
        <div class="when">Will send on Sat, Oct 17, 2026 at 6:00 PM</div>
        <div class="body">Local fixture roles-only row B</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
