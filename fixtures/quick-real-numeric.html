<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Fake skeleton picker</title><style>
/* Fixture only: suppress Chrome's built-in date icon and its CDP data: SVG request. */
input[type=date]::-webkit-calendar-picker-indicator{display:none}
body{background:#0f1419;color:#eee;font:16px system-ui;padding:20px}[role=dialog][aria-modal]{width:540px;border:1px solid #536471;border-radius:16px;padding:16px}select{padding:8px;margin:4px}label{display:block}[role=group]{display:flex;gap:12px;margin:12px 0}button{padding:8px;margin:6px}</style></head><body data-fixture-mode="numeric">
<p>Synthetic labels, IDs, values and dates. Structure and option text lengths follow the masked picker.</p>
<form id="fixture-composer"><button type="submit" id="post">Post fixture</button></form>
<div role="dialog"><div role="group"><div role="dialog" aria-modal="true"><header><h2>Fake picker</h2><button type="button" id="confirm">Confirm fixture</button></header>
<div role="group"><div><label id="fixture-label-month"><span>月</span></label><select id="fake-select-month" aria-labelledby="fixture-label-month" data-testid=""><option disabled selected value=""></option><option value="1">1 月</option><option value="2">2 月</option><option value="3">3 月</option><option value="4">4 月</option><option value="5">5 月</option><option value="6">6 月</option><option value="7">7 月</option><option value="8">8 月</option><option value="9">9 月</option><option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option></select></div><div><label id="fixture-label-day"><span>日</span></label><select id="fake-select-day" aria-labelledby="fixture-label-day" data-testid=""><option disabled selected value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select></div><div><label id="fixture-label-year"><span>年</span></label><select id="fake-select-year" aria-labelledby="fixture-label-year" data-testid=""><option disabled selected value=""></option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option></select></div><div><label><button type="button" id="calendar">Calendar fixture</button><input type="date" value="2027-01-01" min="2027-01-01" max="2029-12-31"></label></div></div>
<div role="group"><div><span>Test</span><div><label id="fixture-label-hour"><span>時</span></label><select id="fake-select-hour" aria-labelledby="fixture-label-hour" data-testid=""><option disabled selected value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></div><div><label id="fixture-label-minute"><span>分</span></label><select id="fake-select-minute" aria-labelledby="fixture-label-minute" data-testid=""><option disabled selected value=""></option><option value="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select></div><div><label id="fixture-label-period"><span>上午/下午</span></label><select id="fake-select-period" aria-labelledby="fixture-label-period" data-testid=""><option value="AM">上午</option><option value="PM">下午</option></select></div></div></div><button type="button" id="schedule">Schedule fixture</button></div></div></div>
<script>
window.fixtureSend={confirm:0,schedule:0,post:0,submit:0,input:0,change:0,calendar:0};
for(const id of ['confirm','schedule','post','calendar'])document.getElementById(id).addEventListener('click',()=>window.fixtureSend[id]++);
for(const form of document.querySelectorAll('form'))form.addEventListener('submit',event=>{event.preventDefault();window.fixtureSend.submit++;});
for(const type of ['input','change'])document.addEventListener(type,event=>{if(event.target.tagName==='SELECT')window.fixtureSend[type]++;});

// Test-only controlled select model: instance .value writes are rejected on repaint.
// The native prototype setter followed by input/change updates controlled state.
const nativeValue=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
const fields=['month','day','year','hour','minute','period'];
const state={},directWrites=new WeakSet(),inputs=new WeakSet();
let queued=false,rebuild=false,rejectOnce=true;
window.fixtureRebuilds=0;window.fixtureRejects=0;
function control(key){return document.getElementById('fake-select-'+key);}
function attach(node) {
 Object.defineProperty(node,'value',{configurable:true,get(){return nativeValue.get.call(this);},set(value){nativeValue.set.call(this,value);directWrites.add(this);queue();}});
}
for(const key of fields){const node=control(key);state[key]=nativeValue.get.call(node);attach(node);}
function queue(){if(!queued){queued=true;requestAnimationFrame(render);}}
function render(){
 queued=false;
 if(rebuild){
  rebuild=false;window.fixtureRebuilds++;
  const old=control('day'),replacement=old.cloneNode(false);
  const blank=document.createElement('option');blank.value='';blank.disabled=true;replacement.append(blank);
  const monthNode=control('month'),monthOption=[...monthNode.querySelectorAll('option')].find(option=>option.value===state.month);
  const month=Number(monthOption?.textContent.trim().split(' ')[0]);
  const size=month?new Date(Number(state.year)||2027,month,0).getDate():31;
  const padded=old.querySelector('option[value="01"]')!==null;
  for(let day=1;day<=size;day++){const option=document.createElement('option');option.value=padded?String(day).padStart(2,'0'):String(day);option.textContent=String(day);replacement.append(option);}
  old.replaceWith(replacement);attach(replacement);
 }
 for(const key of fields){const node=control(key);nativeValue.set.call(node,state[key]);directWrites.delete(node);}
}
document.addEventListener('input',event=>{if(fields.some(key=>control(key)===event.target)&&!directWrites.has(event.target))inputs.add(event.target);});
document.addEventListener('change',event=>{
 const key=fields.find(key=>control(key)===event.target);if(!key)return;
 if(!inputs.has(event.target)||directWrites.has(event.target)){queue();return;}
 inputs.delete(event.target);
 const value=nativeValue.get.call(event.target);
 if(rejectOnce&&((document.body.dataset.fixtureMode==='rollback'&&key==='hour'&&value==='8')||(document.body.dataset.fixtureMode==='autocorrect'&&key==='period'&&value==='PM'))){
  rejectOnce=false;window.fixtureRejects++;queue();return;
 }
 state[key]=value;if(key==='year'||key==='month')rebuild=true;queue();
});
</script></body></html>
