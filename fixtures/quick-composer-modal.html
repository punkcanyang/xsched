<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fake home modal composer</title><style>
input[type=date]::-webkit-calendar-picker-indicator{display:none}
*{box-sizing:border-box}body{margin:0;background:#0f1419;color:#eee;font:14px system-ui;padding:8px}
#fake-composer{width:100%;max-width:580px;margin:auto} [role=textbox]{min-height:80px;border:1px solid #536471;padding:8px}
.fixture-toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.fixture-toolbar button{min-width:32px;padding:6px;background:#15202b;color:#eee;border:1px solid #536471}
[role=dialog][aria-modal]{position:fixed;inset:16px auto auto 16px;width:calc(100vw - 32px);max-width:540px;background:#15202b;z-index:20;padding:12px;border:1px solid #536471;max-height:calc(100vh - 32px);overflow:auto}
[role=group]{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}label{display:block}select{padding:4px}svg{width:20px;height:20px}

#home{max-width:600px;margin:auto}#home-inline{border-bottom:1px solid #536471;padding-bottom:8px}
#compose-modal{inset:40px auto auto 40px;max-width:600px}
</style></head><body><main id="home" aria-label="Home timeline"><nav><span>For you</span> <span>Following</span></nav>
<div id="home-inline"><div data-testid="tweetTextarea_0" role="textbox" contenteditable="true"></div><div class="fixture-toolbar"><button type="button" id="inline-media">Media</button>
<button type="button" id="inline-schedule" data-testid="scheduleOption" role="button" aria-label="Schedule options"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg></button><button type="button" id="inline-post">Post</button></div></div>
<div data-testid="cellInnerDiv"><article data-testid="tweet"><div data-testid="tweetText">Synthetic background post</div></article></div>
</main>
<div id="layers"><div id="compose-modal" role="dialog" aria-modal="true" aria-label="Compose"></div></div>
<template id="fake-picker-template"><div role="group"><div role="dialog" aria-modal="true"><header><h2>Fake modal picker</h2><button type="button" id="confirm">Confirm</button></header>
<div role="group"><div><label id="fixture-label-month"><span>月</span></label><select id="fake-select-month" aria-labelledby="fixture-label-month" data-testid=""><option disabled selected value=""></option><option value="1">1 月</option><option value="2">2 月</option><option value="3">3 月</option><option value="4">4 月</option><option value="5">5 月</option><option value="6">6 月</option><option value="7">7 月</option><option value="8">8 月</option><option value="9">9 月</option><option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option></select></div><div><label id="fixture-label-day"><span>日</span></label><select id="fake-select-day" aria-labelledby="fixture-label-day" data-testid=""><option disabled selected value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select></div><div><label id="fixture-label-year"><span>年</span></label><select id="fake-select-year" aria-labelledby="fixture-label-year" data-testid=""><option disabled selected value=""></option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option></select></div><div><label><button type="button" id="calendar">Calendar fixture</button><input type="date" value="2027-01-01" min="2027-01-01" max="2029-12-31"></label></div></div>
<div role="group"><div><span>Test</span><div><label id="fixture-label-hour"><span>時</span></label><select id="fake-select-hour" aria-labelledby="fixture-label-hour" data-testid=""><option disabled selected value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></div><div><label id="fixture-label-minute"><span>分</span></label><select id="fake-select-minute" aria-labelledby="fixture-label-minute" data-testid=""><option disabled selected value=""></option><option value="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select></div><div><label id="fixture-label-period"><span>上午/下午</span></label><select id="fake-select-period" aria-labelledby="fixture-label-period" data-testid=""><option value="AM">上午</option><option value="PM">下午</option></select></div></div></div></div></div></template><script>
// Synthetic home "For you" compose modal (structure only, fake data, 2027+).
// The schedule icon swaps the SAME aria-modal dialog's content to the picker
// (the editor unmounts); Confirm rebuilds a NEW composer (new editor/toolbar
// nodes) whose Post button reads Schedule; Schedule closes the modal.
window.fixtureMode='normal';window.fixtureSend={icon:0,inlineIcon:0,confirm:0,schedule:0,post:0,submit:0,input:0,change:0,calendar:0};
window.fixtureDraft='A synthetic modal draft for testing';window.fixtureConfirmed=null;
const modal=document.getElementById('compose-modal');
function renderComposer(scheduled){
 const form=document.createElement('form');form.id='modal-composer';
 const header=document.createElement('div');const title=document.createElement('strong');title.textContent='Compose fixture';header.append(title);
 const editor=document.createElement('div');editor.setAttribute('data-testid','tweetTextarea_0');editor.setAttribute('role','textbox');editor.setAttribute('contenteditable','true');editor.textContent=window.fixtureDraft;
 const bar=document.createElement('div');bar.className='fixture-toolbar';
 for(const name of ['Media','GIF','Poll','Emoji']){const b=document.createElement('button');b.type='button';b.textContent=name;bar.append(b);}
 const icon=document.createElement('button');icon.type='button';icon.setAttribute('data-testid','scheduleOption');icon.setAttribute('role','button');icon.setAttribute('aria-label','Schedule options');
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');icon.append(svg);bar.append(icon);
 const post=document.createElement('button');post.type='button';post.id=scheduled?'modal-schedule':'post';post.textContent=scheduled?'Schedule':'Post fixture';bar.append(post);
 form.append(header,editor,bar);
 if(scheduled&&window.fixtureConfirmed){const note=document.createElement('p');note.id='modal-schedule-note';note.textContent='Will send '+window.fixtureConfirmed;form.insertBefore(note,editor);}
 modal.replaceChildren(form);
}
renderComposer(false);
document.addEventListener('click',event=>{
 for(const id of ['confirm','post','calendar'])if(event.target.closest('#'+id))window.fixtureSend[id]++;
 if(event.target.closest('#inline-schedule'))window.fixtureSend.inlineIcon++;
 if(event.target.closest('#compose-modal [data-testid="scheduleOption"]')){
  window.fixtureSend.icon++;
  if(window.fixtureMode==='no-dialog')return;
  const editor=modal.querySelector('[data-testid="tweetTextarea_0"]');if(editor)window.fixtureDraft=editor.textContent;
  modal.replaceChildren(document.getElementById('fake-picker-template').content.cloneNode(true));
  installControlledPicker();
  return;
 }
 if(event.target.closest('#confirm')){
  const v=key=>document.getElementById('fake-select-'+key)?.value||'';
  window.fixtureConfirmed=[v('year'),v('month'),v('day'),v('hour'),v('minute'),v('period')].join('-');
  // Like React's root handler, X reacts after document capture listeners.
  setTimeout(()=>renderComposer(true),0);return;
 }
 if(event.target.closest('#modal-schedule')){
  window.fixtureSend.schedule++;
  setTimeout(()=>{
   document.getElementById('layers').replaceChildren();
   const toast=document.createElement('div');toast.setAttribute('role','status');toast.textContent='Your post was scheduled.';document.body.append(toast);
  },0);
 }
});
document.addEventListener('submit',event=>{event.preventDefault();window.fixtureSend.submit++;});
for(const type of ['input','change'])document.addEventListener(type,event=>{if(event.target.tagName==='SELECT')window.fixtureSend[type]++;});
function installControlledPicker(){
// Test-only controlled select model: instance .value writes are rejected on repaint.
// The native prototype setter followed by input/change updates controlled state.
const nativeValue=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
const fields=['month','day','year','hour','minute','period'];
const state={},directWrites=new WeakSet(),inputs=new WeakSet();
let queued=false,rebuild=false,rejectOnce=true;
window.fixtureRebuilds=0;window.fixtureRejects=0;
function control(key){return document.getElementById('fake-select-'+key);}
function attach(node) {
 Object.defineProperty(node,'value',{configurable:true,get(){return nativeValue.get.call(this);},set(value){nativeValue.set.call(this,value);directWrites.add(this);queue();}});
}
for(const key of fields){const node=control(key);state[key]=nativeValue.get.call(node);attach(node);}
function queue(){if(!queued){queued=true;requestAnimationFrame(render);}}
function render(){
 queued=false;
 if(rebuild){
  rebuild=false;window.fixtureRebuilds++;
  const old=control('day'),replacement=old.cloneNode(false);
  const blank=document.createElement('option');blank.value='';blank.disabled=true;replacement.append(blank);
  const monthNode=control('month'),monthOption=[...monthNode.querySelectorAll('option')].find(option=>option.value===state.month);
  const month=Number(monthOption?.textContent.trim().split(' ')[0]);
  const size=month?new Date(Number(state.year)||2027,month,0).getDate():31;
  const padded=old.querySelector('option[value="01"]')!==null;
  for(let day=1;day<=size;day++){const option=document.createElement('option');option.value=padded?String(day).padStart(2,'0'):String(day);option.textContent=String(day);replacement.append(option);}
  old.replaceWith(replacement);attach(replacement);
  if(document.body.dataset.fixtureMode==='transient') {
   const parent=replacement.parentElement;replacement.remove();
   setTimeout(()=>{parent.append(replacement);nativeValue.set.call(replacement,state.day);},40);
  }
 }
 for(const key of fields){const node=control(key);if(node){nativeValue.set.call(node,state[key]);directWrites.delete(node);}}
}
document.addEventListener('input',event=>{if(fields.some(key=>control(key)===event.target)&&!directWrites.has(event.target))inputs.add(event.target);});
document.addEventListener('change',event=>{
 const key=fields.find(key=>control(key)===event.target);if(!key)return;
 if(!inputs.has(event.target)||directWrites.has(event.target)){queue();return;}
 inputs.delete(event.target);
 const value=nativeValue.get.call(event.target);
 if(rejectOnce&&((document.body.dataset.fixtureMode==='rollback'&&key==='hour'&&value==='8')||(window.fixtureMode==='reject'&&key==='period'&&value==='PM'))){
  rejectOnce=false;window.fixtureRejects++;queue();return;
 }
 state[key]=value;
 if(document.body.dataset.fixtureMode==='interim') {
  if(key==='period'&&value==='PM')state.period='AM';
  if(key==='hour'&&value==='8')state.period='PM';
 }
 if(key==='year'||key==='month')rebuild=true;queue();
});

}
</script></body></html>
